<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h1 class="mb-4 text-center">🎓 Student Management System</h1>
        <div class="row g-4 justify-content-center">
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body text-center">
                        <h5 class="card-title">Admin Dashboard</h5>
                        <p class="card-text">Manage students, attendance, and results.</p>
                        <a href="/admin/" class="btn btn-primary">Go to Admin</a>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body text-center">
                        <h5 class="card-title">Performance Reports</h5>
                        <p class="card-text">View student attendance and marks summary.</p>
                        <a href="/reports/" class="btn btn-success">View Reports</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
